<script>
(function() {
  // ★ UC 浏览器兼容：检测 importmap 支持
  //   UC 基于旧 Chromium (~v80) 不支持 importmap (Chrome 89+)，
  //   不处理会导致 <script type="importmap"> 解析错误，使 Preact 无法加载。
  //   这里设置标志位，让后续 ESM 降级。
  var ua = navigator.userAgent || '';
  window._isUcBrowser = /UCBrowser|UCWEB|UBrowser/.test(ua);
  window._supportImportMap = HTMLScriptElement.supports && HTMLScriptElement.supports('importmap');
  // ── 功能降级跟踪 ──────────────────────
  window._degradedFeatures = [];
  window._reportDegradation = function(name) {
    window._degradedFeatures.push(name);
    var el = document.getElementById('status-text');
    if (el) el.textContent = '降级: ' + window._degradedFeatures.join(', ');
  };
})();
</script>

<!-- ═══ Import Map: 解析 bare specifier（preact/hooks/react 内部引用需要） ═══ -->

</script>

<!-- Mermaid 懒加载（3.2MB，移动端避免 OOM） -->
<script>
(function() {
  // ★ UC 浏览器兼容：3.2MB 的 mermaid 延迟到 DOMContentLoaded 后异步加载
  //   避免同步加载导致移动端 OOM 闪退
  window._mermaidLoaded = false;
  document.addEventListener('DOMContentLoaded', function() {
    var s = document.createElement('script');
    s.src = 'lib/mermaid.min.js';
    s.async = true;
    s.onerror = function() {
      console.warn('Mermaid 懒加载失败，图表渲染将降级');
      window._mermaidFailed = true;
      window._reportDegradation('图表渲染');
    };
    s.onload = function() {
      window._mermaidLoaded = true;
    };
    document.body.appendChild(s);
  });
})();
</script>

<!-- ═══ react-markdown 引擎已打包到 lib/md-engine.bundle.js（ESM 模块加载） ═══ -->
<!-- fallback：ESM 加载前的兜底渲染 -->
<script>
window.renderMarkdown = window.renderMarkdown || function _fallbackRender(text) {
  if (!text) return '';
  // 简单 HTML 转义 + 换行转 <br>
  const escaped = String(text)
    .replace(/&/g, '&amp;')
    .replace(/</g, '&lt;')
    .replace(/>/g, '&gt;')
    .replace(/"/g, '&quot;');
  return escaped.replace(/\n/g, '<br>');
};
</script>
<script>
// UC 浏览器兼容检测日志

    if (!window._supportImportMap) {
      console.warn('[compat] importmap 不受支持，Preact 组件将降级为 vanilla DOM');
    }
  }
})();

<!-- ═══ 移动端键盘弹出适配 (VisualViewport API) ═══ -->
<script>
(function() {
  'use strict';
  if (!window.visualViewport) return;

  var body = document.body;
  var inputArea = document.getElementById('input-area');
  var header = document.getElementById('header');
  var messages = document.getElementById('messages');
  if (!inputArea || !messages) return;

  var _lastHeight = window.visualViewport.height;

  function _onViewportChange() {
    var vv = window.visualViewport;
    var vh = vv.height;
    var isKeyboardOpen = vh < _lastHeight * 0.85;

    // 固定 body 高度为视觉视口高度，防止键盘弹出时页面整体上移
    body.style.height = vh + 'px';

    if (isKeyboardOpen) {
      // 键盘弹出：滚动到消息底部，确保最新内容可见
      messages.scrollTop = messages.scrollHeight;
      // 给渲染留出时间后再次滚动
      requestAnimationFrame(function() {
        messages.scrollTop = messages.scrollHeight;
      });
    }

    _lastHeight = vh;
  }

  window.visualViewport.addEventListener('resize', _onViewportChange);
  window.visualViewport.addEventListener('scroll', _onViewportChange);
})();
</script>

<!-- ═══ 横竖屏切换适配 + 空引导控制 ═══ -->
<script>
(function() {
  'use strict';
  // 空引导控制：监听 messages 中的气泡变化
  var messages = document.getElementById('messages');
  var hint = document.getElementById('empty-hint');
  if (messages && hint) {
    var observer = new MutationObserver(function() {
      var hasBubble = messages.querySelector('.bubble') !== null;
      hint.style.display = hasBubble ? 'none' : '';
    });
    observer.observe(messages, { childList: true, subtree: true });
    hint.style.display = messages.querySelector('.bubble') ? 'none' : '';
  }

  // 横竖屏切换：滚动到消息底部
  if (window.visualViewport) {
    window.addEventListener('orientationchange', function() {
      setTimeout(function() {
        var msgs = document.getElementById('messages');
        if (msgs) msgs.scrollTop = msgs.scrollHeight;
      }, 300);
    });
  }
})();
</script>

<!-- ═══ Service Worker 注册 (PWA 离线缓存) ═══ -->
<script>
(function() {
  if ('serviceWorker' in navigator && !window._isUcBrowser) {
    window.addEventListener('load', function() {
      navigator.serviceWorker.register('service-worker.js', { scope: '/' }).then(function(reg) {
        console.log('[SW] 注册成功, scope:', reg.scope);
        reg.onupdatefound = function() {
          var installing = reg.installing;
          if (installing) {
            installing.onstatechange = function() {
              if (installing.state === 'installed' && navigator.serviceWorker.controller) {
                console.log('[SW] 新版本已缓存，下次加载生效');
              }
            };
          }
        };
      }).catch(function(err) {
        console.warn('[SW] 注册失败:', err.message);
        if (window._reportDegradation) window._reportDegradation('离线缓存');
      });
    });
  }
})();
</script>
