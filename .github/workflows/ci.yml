name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  PIP_DISABLE_PIP_VERSION_CHECK: "1"
  PYTHONUNBUFFERED: "1"

jobs:
  # ── 静态检查（快速失败） ────────────────────────────────
  lint:
    name: Lint (ruff) / Types (mypy baseline)
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.9", "3.13"]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install dev dependencies
        run: pip install ".[dev]"

      # F 组（Pyflakes：未使用导入/未定义名/无效 f-string 等）与 E9（语法/IO）
      # 为阻塞项——这两组是真实缺陷而非风格偏好。其余规则组（I/N/UP/B/SIM）
      # 已在 pyproject 配置中声明，待整理完成后逐组启用（见 pyproject 注释）。
      - name: ruff (blocking: F, E9)
        run: ruff check --select F,E9 .

      - name: ruff (informational: project config)
        continue-on-error: true
        run: ruff check .

      # 类型基线：tests/test_type_baseline.py 断言 mypy 错误数不超过基线值。
      # 默认跳过（本地快速测试路径），CI 中显式启用作为回归闸门。
      - name: mypy type baseline
        env:
          RUN_MYPY_BASELINE: "1"
        run: python -m pytest tests/test_type_baseline.py -q -o addopts=""

  # ── 全量测试 + 覆盖率 ──────────────────────────────────
  test:
    name: Tests (py${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.9", "3.13"]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install dev dependencies
        run: pip install ".[dev]"

      - name: Run full test suite (correctness + performance budgets)
        # 不带覆盖率：coverage 的逐行插桩会让时间预算型用例失真（tests/conftest.py
        # 的 _skip_timing_budget_when_measuring_coverage 亦据此在 --cov 模式下跳过）。
        run: python -m pytest tests

      - name: Coverage gate
        # 覆盖面统计与阈值校验（时间预算用例已由上一非插桩步骤验证）
        run: python -m pytest tests --cov=src --cov-report=term-missing --cov-report=xml

      - name: Upload coverage artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-${{ matrix.python-version }}
          path: coverage.xml
          if-no-files-found: ignore
