[build-system]
requires = ["setuptools"]
build-backend = "setuptools.build_meta"

[project]
name = "ai-chat"
version = "2.2.0"
description = "全异步、高可扩展的 AI 聊天服务后端，支持多模型适配、增量流式 Markdown 渲染、工具调用系统、上下文压缩和终端+Web 双界面"
requires-python = ">=3.9"
dependencies = [
    "aiohttp>=3.9",
    "httpx>=0.27",
    "rich>=10",
    "Pygments>=2.16",
    "Jinja2>=3.1",
    "beautifulsoup4>=4.12",
    "chardet>=3.0",
    "aiofiles>=23",
]

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "pytest-asyncio",
    "pytest-xdist",
    "pytest-cov>=5",
    "ruff>=0.3",
    "mypy>=1.8",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
addopts = ["-n", "auto", "-v", "--tb=short", "--dist=load"]
markers = {"timeout" = "mark a test as a timeout test (deregistered, timeout handled by ToolExecutor internally)"}

[tool.coverage.run]
source = ["src"]
omit = ["*/__pycache__/*", "*/tests/*"]

[tool.coverage.report]
fail_under = 40
show_missing = true

[tool.ruff]
line-length = 120
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP", "B", "SIM"]
ignore = ["E501"]

[tool.ruff.format]
quote-style = "double"
indent-width = 4

[tool.mypy]
python_version = "3.13"
strict = false
ignore_missing_imports = true
warn_unused_ignores = true
files = ["src/"]
